name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roteirize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roteirize_test
      JWT_SECRET: segredo-de-teste-do-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do back-end
        run: npm ci

      - name: Rodar migrations
        run: npm run migrate:up

      - name: Lint do back-end
        run: npm run lint

      - name: Build do back-end
        run: npm run build

      - name: Testes do back-end
        run: npm test

      - name: Instalar dependências do front-end
        run: npm ci
        working-directory: web

      - name: Lint do front-end
        run: npm run lint
        working-directory: web

      - name: Build do front-end
        run: npm run build
        working-directory: web